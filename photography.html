<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Photography | Lena Wunderlich</title>

  <link rel="stylesheet" href="style.css">
</head>
<script>
  async function loadGallery() {
    const gallery = document.getElementById("photo-grid");
    const status = document.getElementById("gallery-status");

    /*
      Diese automatische Erkennung funktioniert für eine Webseite wie:

      benutzername.github.io

      Das dazugehörige Repository muss ebenfalls heissen:

      benutzername.github.io
    */

    const hostname = window.location.hostname;
    const username = hostname.split(".")[0];
    const repository = `${username}.github.io`;
    const imageFolder = "images";

    const apiUrl =
      `https://api.github.com/repos/${username}/${repository}/contents/${imageFolder}`;

    try {
      const response = await fetch(apiUrl, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          `GitHub returned status ${response.status}`
        );
      }

      const files = await response.json();

      if (!Array.isArray(files)) {
        throw new Error("The images folder could not be read.");
      }

      const imageFiles = files
        .filter((file) => {
          const isFile = file.type === "file";
          const isImage =
            /\.(avif|gif|jpe?g|png|webp)$/i.test(file.name);

          return isFile && isImage && file.download_url;
        })
        .sort((a, b) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          )
        );

      if (imageFiles.length === 0) {
        status.textContent =
          "No images were found in the images folder.";
        return;
      }

      const fragment = document.createDocumentFragment();

      imageFiles.forEach((file, index) => {
        const figure = document.createElement("figure");
        figure.className = "photo-item";

        const image = document.createElement("img");

        image.src = file.download_url;
        image.alt = createAltText(file.name);

        /*
          Die ersten Bilder werden sofort geladen.
          Weitere Bilder werden erst beim Scrollen geladen.
        */
        image.loading = index < 3 ? "eager" : "lazy";
        image.decoding = "async";

        figure.appendChild(image);
        fragment.appendChild(figure);
      });

      gallery.appendChild(fragment);
      status.remove();

    } catch (error) {
      console.error("Gallery error:", error);

      status.textContent =
        "The gallery could not be loaded. Please try again later.";
    }
  }

  function createAltText(filename) {
    const nameWithoutExtension =
      filename.replace(/\.[^/.]+$/, "");

    const readableName = nameWithoutExtension
      .replace(/[-_]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if (!readableName) {
      return "Portfolio photograph";
    }

    return readableName.charAt(0).toUpperCase()
      + readableName.slice(1);
  }

  loadGallery();
</script>

  <header>

      </p>
<section

</p>
